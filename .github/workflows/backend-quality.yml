name: Backend Quality Gate

on:
  pull_request:
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "tests/**"
      - "scripts/check-secret-hygiene.js"
      - "package.json"
      - "package-lock.json"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/backend-quality.yml"
  push:
    branches:
      - "codex/**"
      - "hardening/**"
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "tests/**"
      - "scripts/check-secret-hygiene.js"
      - "package.json"
      - "package-lock.json"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/backend-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-quality:
    name: Functions lint, unit tests, and Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install app dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm --prefix functions ci

      - name: Run backend quality gate
        run: npm run ci:backend
