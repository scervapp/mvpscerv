name: Web build checks

on: pull_request

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root dependencies
        run: npm ci
      - name: Secret hygiene
        run: npm run security:secret-scan
      - name: Install Scerv website dependencies
        run: npm ci
        working-directory: web-app/scervWeb
      - name: Build Scerv website
        run: npm run build
        working-directory: web-app/scervWeb
      - name: Install admin portal dependencies
        run: npm ci
        working-directory: web-app/admin
      - name: Build admin portal
        run: npm run build
        working-directory: web-app/admin
