<!DOCTYPE html>
<html>
<head>
    <title>Payment Cancelled - Redirecting...</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
     <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding: 30px 15px; text-align: center; color: #333; }
        .message { font-size: 1.1em; }
        .note { font-size: 0.9em; color: #555; margin-top: 15px; }
    </style>
    <script>
        function redirectCancel() {
             try {
                 // --- !!! REPLACE 'yourappscheme://' with YOUR actual app scheme !!! ---
                const redirectUrl = 'scerv://checkout/cancel';
                 // --- !!! END REPLACE ---

                console.log('Stripe Cancel: Redirecting to:', redirectUrl);
                // Use replace to avoid adding this temporary page to browser history
                window.location.replace(redirectUrl);
             } catch (e) {
                console.error("Error during cancel redirect:", e);
                document.getElementById('message').innerText = 'Error redirecting back to the app. Please open the app manually.';
                 document.getElementById('note').innerText = ''; // Hide secondary note
             }
        }
         // Run redirect as soon as the page loads
         window.onload = redirectCancel;
    </script>
</head>
<body>
    <p class="message" id="message">Payment process cancelled...</p>
    <p class="note" id="note">You will be redirected back to the app shortly.</p>
    <p class="note">If you are not redirected automatically, please switch back to the app.</p>
</body>
</html>
