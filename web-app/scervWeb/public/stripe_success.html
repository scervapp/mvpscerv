<!DOCTYPE html>
<html>
<head>
    <title>Payment Success - Redirecting...</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding: 30px 15px; text-align: center; color: #333; }
        .message { font-size: 1.1em; }
        .note { font-size: 0.9em; color: #555; margin-top: 15px; }
    </style>
    <script>
        function redirectSuccess() {
            try {
                const params = new URLSearchParams(window.location.search);
                const sessionId = params.get('session_id');

                // --- !!! REPLACE 'yourappscheme://' with YOUR actual app scheme !!! ---
                let redirectUrl = 'scerv://checkout/success';
                // --- !!! END REPLACE ---

                if (sessionId) {
                    // Append session ID so your app can potentially use it
                    redirectUrl += '?session_id=' + encodeURIComponent(sessionId);
                    console.log('Stripe Success: Redirecting to:', redirectUrl);
                    // Use replace to avoid adding this temporary page to browser history
                    window.location.replace(redirectUrl);
                } else {
                    // Fallback if session_id is missing for some reason
                    console.warn('Stripe Success: Checkout Session ID not found in query parameters. Redirecting without it.');
                     // --- !!! REPLACE 'yourappscheme://' with YOUR actual app scheme !!! ---
                    window.location.replace('scerv://checkout/success');
                     // --- !!! END REPLACE ---
                }
            } catch (e) {
                console.error("Error during success redirect:", e);
                // Display error message to user if redirect fails
                document.getElementById('message').innerText = 'Error redirecting back to the app. Please open the app manually to check your order status.';
                document.getElementById('note').innerText = ''; // Hide secondary note
            }
        }
        // Run redirect as soon as the page loads
        window.onload = redirectSuccess;
    </script>
</head>
<body>
    <p class="message" id="message">Processing successful payment...</p>
    <p class="note" id="note">You will be redirected back to the app shortly.</p>
    <p class="note">If you are not redirected automatically, please switch back to the app.</p>
</body>
</html>
